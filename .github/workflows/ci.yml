# VeriArfy — surekli entegrasyon.
#
# NEDEN BES AYRI IS
#
# Depoda bes farkli calisma zamani var (Rust/Wasm, Solidity, Circom, Node,
# Python) ve bunlarin kurulum maliyetleri cok farkli. Tek bir ise toplamak,
# bir satirlik bir TypeScript hatasi icin 2 GB'lik concrete-ml kurulumunu
# beklemek demekti. Ayri isler paralel kosar ve hangi katmanin kirildigi
# dogrudan gorunur.
#
# BU DOSYA NEDEN VAR
#
# `PublicEncryptor` mimari pivotta kaldirildi ama ona bagimli entegrasyon
# testi geride kaldi ve haftalarca fark edilmedi: `cargo test --lib` yesil
# goruyordu, `cargo test` ise derlenmiyordu. Boyle bir seyin bir daha sessizce
# birikmemesi icin her katman her itmede kosar.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Gunluk kosum yalnizca depolama tanigini denetlemek icin (bkz. `storage-audit`).
  # Kod degismese bile ZINCIRDEKI durum degisebilir: bir anlasma dusebilir,
  # suresi dolabilir ya da tanik yanlis beyanda bulunabilir.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Ayni dal uzerinde yeni bir itme gelirse eskisini iptal et: CI kuyrugu
# tutmasin.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust — iki Wasm crate'i: VCF ayristirici ve FHE sifreleyici
  # ---------------------------------------------------------------------------
  rust:
    name: Rust ve Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tarayici hedefi: derlenmezse kullanici tarafinda hicbir sey calismaz.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/client-side-rust
            packages/client-fhe-rust

      - name: VCF ayristirici — testler
        working-directory: packages/client-side-rust
        run: cargo test --release

      - name: VCF ayristirici — wasm hedefi derleniyor mu
        working-directory: packages/client-side-rust
        run: cargo check --release --target wasm32-unknown-unknown

      # `--release` zorunlu: FHE testleri debug profilinde dakikalarca surer.
      - name: FHE sifreleyici — testler (lib + entegrasyon)
        working-directory: packages/client-fhe-rust
        run: cargo test --release

      - name: FHE sifreleyici — wasm hedefi derleniyor mu
        working-directory: packages/client-fhe-rust
        run: cargo check --release --target wasm32-unknown-unknown

      # ---------------------------------------------------------------------
      # wasm-pack paketleri — arayuz bunlara BAGIMLI
      # ---------------------------------------------------------------------
      #
      # `cargo check --target wasm32` derlemenin gectigini soyler ama
      # wasm-pack'in TypeScript bildirimlerini ve JS sarmalayicisini uretip
      # uretmedigini SOYLEMEZ. Arayuz tam olarak o ciktilari import ediyor:
      #
      #   src/lib/vcfWorker.ts → @veriarfy/client-side-rust/pkg/veriarfy_vcf_parser.js
      #   src/lib/fheWorker.ts → @veriarfy/client-fhe-rust/pkg/veriarfy_client_fhe.js
      #
      # `pkg/` gitignore'da (uretilebilir cikti) ve `js` isi Rust arac
      # zincirine sahip degil. Sonuc: `web:build` CI'da her kosuda TS2307 ile
      # dusuyordu, yerelde ise `pkg/` diskte durdugu icin sorunsuz geciyordu.
      # Klasik "bende calisiyor" tuzagi.
      #
      # Paketler BURADA uretilir (arac zinciri ve onbellek zaten burada) ve
      # `js` isine artefakt olarak devredilir.
      # Resmi kurulum betigi: ucuncu taraf bir action eklemek yerine
      # rustwasm'in kendi dagitimindan onceden derlenmis ikili indirilir.
      - name: wasm-pack kur
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: VCF ayristirici — wasm paketi
        run: npm run wasm:build

      - name: FHE sifreleyici — wasm paketi
        run: npm run fhe:build

      - name: Paketleri devret
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: |
            packages/client-side-rust/pkg
            packages/client-fhe-rust/pkg
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Solidity — fhEVM sozlesmeleri
  # ---------------------------------------------------------------------------
  contracts:
    name: Akilli sozlesmeler
    runs-on: ubuntu-latest
    # Testler GERCEK ZK kaniti uretiyor; devre ciktilari olmadan kosamazlar.
    needs: zk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Devre ciktilarini al
        uses: actions/download-artifact@v4
        with:
          name: circuit-build
          path: packages/circuits/build

      # Depodaki dogrulayicilarin UZERINE yazar. Sart: zkey ile dogrulayici
      # ayni torenden gelmezse uretilen her kanit reddedilir.
      - name: Dogrulayici sozlesmelerini al
        uses: actions/download-artifact@v4
        with:
          name: circuit-verifiers
          path: packages/contracts/contracts/verifiers

      - name: Devre ciktilari yerinde mi
        run: |
          test -f packages/circuits/build/data_provenance_final.zkey
          test -f packages/circuits/build/data_provenance_js/data_provenance.wasm
          test -f packages/circuits/build/researcher_identity_final.zkey

      - name: Derle
        run: npm run contracts:compile

      - name: Testler
        run: npm run contracts:test

  # ---------------------------------------------------------------------------
  # Depolama tanigi denetimi — rapor §2.9.2
  # ---------------------------------------------------------------------------
  #
  # NEDEN AYRI VE NEDEN GUNLUK
  #
  # `VeriarfyStorage` iki farkli sey yapar: politikayi ZORLAR (guvensiz) ama
  # "boyle bir anlasma var mi" olgusunu bir TANIK beyan eder. Ethereum,
  # Filecoin'in durumunu goremedigi icin bu kacinilmaz.
  #
  # Tasarim geregi tanigin yalani tespit EDILEBILIR: her kayit bir `dealId`
  # tasir ve Filecoin'in herkese acik RPC'sinden dogrulanabilir. Ama
  # "edilebilir" ile "edilir" ayni sey degildir — kimse betigi kosturmazsa
  # yanlis kayit aylarca durur.
  #
  # Bu is o farki kapatir: tanik yanlis beyanda bulunursa en gec 24 saat
  # icinde CI kirilir. Zincir durumu koda bagli olmadigi icin `schedule` ile
  # de kosar.
  #
  # Kimlik bilgisi GEREKMEZ: hem Sepolia hem Filecoin ucu genel okuma.
  storage-audit:
    name: Depolama tanigi denetimi
    runs-on: ubuntu-latest
    # Catallar depo sirlarina erisemez; zaten sir gerekmiyor ama gereksiz
    # kosumu de engelleyelim.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Derle
        run: npm run contracts:compile

      - name: Anlasma kayitlarini Filecoin ile karsilastir
        working-directory: packages/contracts
        run: npx hardhat run scripts/verify-storage-deals.ts --network sepolia

  # ---------------------------------------------------------------------------
  # ZK — Circom devresi bastan kuruluyor
  # ---------------------------------------------------------------------------
  #
  # `bin/`, `ptau/` ve `build/` gitignore'da; yani bu is devreyi sifirdan
  # derleyip anahtar toreni yapiyor ve ancak ondan sonra kaniti dogruluyor.
  # Yerelde islenmis bir artefakta guvenmiyoruz.
  zk:
    name: ZK devresi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # circom ikilisi ve ~38 MB'lik ptau her kosuda yeniden indirilmesin.
      # ANAHTAR ptau surumunu icermeli: dosya 14'ten 15'e cikarildiginda eski
      # onbellek sessizce kucuk dosyayi servis eder ve setup bozuk zkey uretir.
      - name: circom ve ptau onbellegi
        uses: actions/cache@v4
        with:
          path: |
            packages/circuits/bin
            packages/circuits/ptau
          key: circom2.2.3-ptau15-${{ runner.os }}

      - name: circom derleyicisini getir
        run: npm run setup --workspace packages/circuits

      # Iki devre: researcher_identity (kimlik) ve data_provenance (veri kokeni).
      - name: Devreleri derle ve anahtarlari uret
        run: npm run circuits:build

      # Testlerin cogu OLUMSUZ: degistirilmis panel, akredite olmayan kurum,
      # bicim disi dozaj, nullifier atlatma denemesi. Bir devrenin degeri
      # neyi kabul ettiginde degil, neyi reddettigindedir.
      - name: Kanit uretimi ve reddetme senaryolari
        run: npm run test --workspace packages/circuits

      # ---------------------------------------------------------------------
      # Devre ciktilari — SOZLESME testleri de bunlara bagimli
      # ---------------------------------------------------------------------
      #
      # `VeriarfyProtocol.test.ts` ve `VeriarfyPayments.test.ts` GERCEK kanit
      # uretiyor: zincirdeki Groth16 dogrulayicinin gercekten kapi olup
      # olmadigini baska turlu sinamak mumkun degil. Bunun icin wasm tanigi
      # ve final zkey gerekiyor, ikisi de `build/` altinda ve gitignore'da.
      #
      # `contracts` isi bunlari uretmiyordu, dolayisiyla 8 test "Devre
      # ciktilari yok" ile duserdi. Burada uretiliyorlar; ikinci kez uretmek
      # yerine devrediliyor.
      #
      # Ara zkey'ler (`*_0000.zkey`, 17 MB) haric: toren ciktisi olan
      # `_final` yeterli.
      - name: Devre ciktilarini devret
        uses: actions/upload-artifact@v4
        with:
          name: circuit-build
          path: |
            packages/circuits/build
            !packages/circuits/build/*_0000.zkey
            !packages/circuits/build/*.sym
            !packages/circuits/build/*.r1cs
          retention-days: 1

      # ---------------------------------------------------------------------
      # DOGRULAYICI SOZLESMELERI de devredilmek ZORUNDA
      # ---------------------------------------------------------------------
      #
      # Toren her kosuda FARKLI bir zkey uretiyor; entropi zamana bagli:
      #
      #     zKey.contribute(zkey0, zkeyFinal, "veriarfy-dev", `veriarfy-${Date.now()}`)
      #
      # Yani depoya islenmis `verifiers/*.sol`, CI'nin taze urettigi zkey ile
      # ASLA uyusmaz. Yalnizca zkey devredilirse sozlesme testleri taze kanit
      # uretip eski dogrulayiciya sorar ve hepsi `InvalidProof()` ile duser —
      # tam olarak yasanan buydu (17 test).
      #
      # `circuits:build` dogrulayicilari zaten yeniden yaziyor; onlari da
      # devretmek, zkey ile dogrulayicinin AYNI torenden gelmesini garanti
      # eder. Ayri artefakt cunku ortak ust klasorleri yok.
      - name: Dogrulayici sozlesmelerini devret
        uses: actions/upload-artifact@v4
        with:
          name: circuit-verifiers
          path: packages/contracts/contracts/verifiers
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Node ve TypeScript — istatistik motoru ve arayuz
  # ---------------------------------------------------------------------------
  js:
    name: Arayuz ve istatistik
    runs-on: ubuntu-latest
    # Arayuz, `rust` isinin urettigi wasm paketlerine bagimli. Bu, iki isi
    # sirali hale getirir; alternatifi Rust arac zincirini burada da kurmak
    # olurdu ki daha yavas ve iki yerde bakim demek.
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm ci` calistiktan SONRA indirilmeli: workspace bagi kurulurken
      # `pkg/` yoksa sorun degil, ama derlemeden once yerinde olmali.
      # DIKKAT — hedef klasor `packages`, `.` DEGIL.
      #
      # `upload-artifact` birden fazla yol verildiginde arsivin kokunu
      # yollarin EN YAKIN ORTAK ATASI yapar; burada bu `packages/`. Yani
      # arsivin icinde `client-side-rust/pkg/...` durur. `.` dizinine
      # acilirsa dosyalar `./client-side-rust/pkg` altina duser ve derleme
      # yine bulamaz.
      - name: wasm paketlerini al
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages

      - name: Paketler yerinde mi
        run: |
          test -f packages/client-side-rust/pkg/veriarfy_vcf_parser.js
          test -f packages/client-fhe-rust/pkg/veriarfy_client_fhe.js

      - name: Istatistik motoru — oz test
        run: npm run study:test

      # `web:build` zaten `tsc -b` calistirir; tip hatasi burada yakalanir.
      - name: Arayuz — tip denetimi ve derleme
        run: npm run web:build

  # ---------------------------------------------------------------------------
  # Python — Concrete kopru kaniti
  # ---------------------------------------------------------------------------
  #
  # Bu isin kanitladigi sey projenin en zor esigi: tarayicinin kendi gizli
  # anahtariyla urettigi sifreli metni Concrete devresinin kabul etmesi ve
  # sifreli hesabin duz metinle birebir esitlenmesi.
  ml:
    name: Sifreli cikarim koprusu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # concrete-ml 1.9 yalnizca 3.11'e kadar tekerlek yayinliyor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/ml/requirements.bridge.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/client-fhe-rust

      - name: Python bagimliliklari
        working-directory: packages/ml
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.bridge.txt

      # Test, tarayici rolunu bu ornegi calistirarak oynar. Onceden derliyoruz:
      # aksi halde derleme hatasi testte "skip" olarak gorunur ve CI yesil kalir.
      - name: Tarayici sifreleyicisini derle
        working-directory: packages/client-fhe-rust
        run: cargo build --release --example sk_encrypt

      - name: Kopru testleri
        working-directory: packages/ml
        env:
          # concrete-cpu ve scikit-learn iki ayri OpenMP calisma zamani
          # yukluyor; teardown'da cift-init cakismasi olusuyor. Bu gecici bir
          # susturmadir, cozum degil — bkz. docs/mimari (acik madde).
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: .venv/bin/python -m pytest tests/test_client_key_import.py -v

  # ---------------------------------------------------------------------------
  # Guvenlik taramasi — su an DANISMA niteliginde
  # ---------------------------------------------------------------------------
  #
  # Slither, standart Solidity zafiyet kaliplarini (reentrancy, erisim
  # kontrolu, overflow) tarar. FHE'ye ozgu islemler (euint8, FHE.add) kapsam
  # disidir; o katmanin guvenligi Zama'nin kendi denetimine dayanir.
  #
  # NEDEN AYRI BIR "KAYNAK HIZALAMA" ADIMI VAR
  #
  # Slither aylarca hic calismadi; her kosuda parse asamasinda cokuyordu:
  #
  #     InvalidCompilation: Source map for '@fhevm/solidity/config/ZamaConfig.sol'
  #     falls outside the cached source.
  #
  # Sebep fhEVM hardhat eklentisi. Eklenti, derlemeden once @fhevm
  # kaynaklarini `fhevmTemp/` altina KOPYALAYIP DEGISTIRIYOR: goreli
  # import'lari paket import'una ceviriyor ve mock KMS adreslerini yaziyor.
  # solc bu degistirilmis dosyayi derliyor, dolayisiyla kaynak haritasi ona
  # gore. Slither ise ayni yolu `node_modules` altina cozuyor ve orada 26
  # bayt daha kisa bir dosya buluyor — ofsetler tasiyor, arac cokuyor.
  #
  # Cozum, Slither'a solc'un GERCEKTEN derledigi kaynagi gostermek: eklentinin
  # urettigi dosyalari `node_modules` uzerine kopyalamak. Bu satirdan sonra
  # arac 50 sozlesmeyi 102 dedektorle tariyor.
  #
  # `continue-on-error` yine de duruyor: bulgu sayisi (~1000, cogu bilgi
  # duzeyi) triyaj edilmeden yesil/kirmizi karari verdirmemeli.
  slither:
    name: Slither (danisma)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Derleme BURADA yapilir (action'in kendi derlemesi degil): `fhevmTemp`
      # ancak derleme sirasinda olusur ve bir sonraki adim ona ihtiyac duyar.
      - name: Derle
        run: npm run contracts:compile

      - name: fhEVM kaynaklarini derlenen haliyle hizala
        working-directory: packages/contracts
        run: |
          if [ -d fhevmTemp ]; then
            cp -R fhevmTemp/. node_modules/
            echo "fhevmTemp -> node_modules hizalandi"
          else
            echo "fhevmTemp yok — eklenti kaynak degistirmemis olabilir"
          fi

      - uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts
          # Zaten derledik; action yeniden derlerse hizalama bozulur.
          ignore-compile: true
          fail-on: none
