# VeriArfy — arayuz disindaki servis.
#
# Arayuz Vercel'de duruyor ve tamamen statiktir. Burada tek bir servis var:
#
#   kurator : akredite katilimci Merkle agacini tutar. Arastirmaci ZK kaydi
#             bu agactan gelen yol olmadan yapilamaz; durum tuttugu icin
#             sunucusuz bir fonksiyona tasinamaz.
#
# ML servisi KALDIRILDI. Ana sayfadaki anket kaldirilinca tek kullanicisi
# kalmadi; ~2 GB'lik concrete-ml imajini bosuna derlemeye gerek yok.
# Arastirma kodu `packages/ml` altinda duruyor, yerelde calistirilabilir.
#
# Servis Sepolia'ya yalnizca OKUMA yapar; ozel anahtar tutmaz.
# Kok guncellemesi (`curator:push-root`) bilincli olarak elle calistirilir —
# zincire yazan bir islemi barindirilan servise vermek, anahtari oraya
# koymak demekti.
services:
  - type: web
    name: veriarfy-curator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node packages/curator/src/server.js
    envVars:
      - key: CURATOR_PORT
        value: 10000
      # IPFS yuklemesi icin; verilmezse /ipfs/upload ucu calismaz,
      # kayit akisi etkilenmez.
      - key: PINATA_JWT
        sync: false
      # Kurator kokunu zincire YAZAN cuzdan.
      #
      # Tanimliysa servis her yeni kayittan sonra VeriArfyRegistry.updateRoot
      # cagirir ve arastirmaci kaydi tek adimda tamamlanir. Tanimli degilse
      # kayit akisi calismaya devam eder ama kok yazimi elle yapilmalidir
      # (npm run curator:push-root) ve /enroll `rootPending: true` doner.
      #
      # KAPSAM: bu cuzdanin tek yetkisi `updateRoot`. Dagitim anahtarini
      # BURAYA KOYMAYIN - ayri bir cuzdan uretin ve registry sahipligini ona
      # devredin (packages/contracts/scripts/transfer-registry-owner.ts).
      - key: CURATOR_PRIVATE_KEY
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false

  # Yetkili dugum servisi - acilim taleplerini politikaya gore onaylar.
  #
  # Bu servis olmadan arastirmaci ucreti oder, talep acilir ve HIC
  # onaylanmaz; sonuc uretilemez ve kullanicinin yapabilecegi bir sey yoktur.
  #
  # BAGIMSIZLIK: NODE_PRIVATE_KEYS'e birden fazla anahtar konursa hepsi TEK
  # proseste calisir ve M-of-N esigi gercek bir dagitimi temsil etmez. Testnet
  # icin kabul edilebilir; uretimde her dugum ayri kurumda, ayri servis olarak
  # calismalidir.
  - type: web
    name: veriarfy-node-operator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node packages/node-operator/src/server.js
    envVars:
      - key: NODE_OPERATOR_PORT
        value: 10000
      # Virgulle ayrilmis dugum ozel anahtarlari. Yalnizca `approveDisclosure`
      # ve `heartbeat` yetkisi vardir; dagitim anahtarini BURAYA KOYMAYIN.
      - key: NODE_PRIVATE_KEYS
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
