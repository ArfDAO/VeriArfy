# VeriArfy — arayuz disindaki servis.
#
# Arayuz Vercel'de duruyor ve tamamen statiktir. Burada tek bir servis var:
#
#   kurator : akredite katilimci Merkle agacini tutar. Arastirmaci ZK kaydi
#             bu agactan gelen yol olmadan yapilamaz; durum tuttugu icin
#             sunucusuz bir fonksiyona tasinamaz.
#
# ML servisi KALDIRILDI. Ana sayfadaki anket kaldirilinca tek kullanicisi
# kalmadi; ~2 GB'lik concrete-ml imajini bosuna derlemeye gerek yok.
# Arastirma kodu `packages/ml` altinda duruyor, yerelde calistirilabilir.
#
# Servis Sepolia'ya yalnizca OKUMA yapar; ozel anahtar tutmaz.
# Kok guncellemesi (`curator:push-root`) bilincli olarak elle calistirilir —
# zincire yazan bir islemi barindirilan servise vermek, anahtari oraya
# koymak demekti.
services:
  - type: web
    name: veriarfy-curator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node packages/curator/src/server.js
    envVars:
      - key: CURATOR_PORT
        value: 10000
      # IPFS yuklemesi icin; verilmezse /ipfs/upload ucu calismaz,
      # kayit akisi etkilenmez.
      - key: PINATA_JWT
        sync: false
